<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Noti Voice · 后台管理</title>
<style>
  :root{
    --blue:#43A6FF; --blue-deep:#0057D9; --purple:#7164D9;
    --bg:#f5f5f7; --card:#ffffff; --text:#1d1d1f; --muted:#6e6e73;
    --border:#e3e3e8; --radius:16px; --shadow:0 8px 32px rgba(0,0,0,.08);
    --input-bg:#fff; --btn:#007aff;
    --ok:#187a41; --ok-bg:#e5f7ec; --read:#9a5b00; --read-bg:#fff2dd; --new:#666; --new-bg:#eceff3;
    --c-blue:#43A6FF; --c-blue2:#0057D9; --c-purple:#7164D9; --c-purple2:#4B3FA8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e0e10; --card:#1c1c1e; --text:#f5f5f7; --muted:#a1a1a6;
      --border:#333338; --shadow:0 8px 32px rgba(0,0,0,.5); --input-bg:#2a2a2e; --btn:#0a84ff;
    }
  }
  *{box-sizing:border-box}
  body{font:15px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);margin:0;padding:28px 16px;-webkit-font-smoothing:antialiased}
  a{color:var(--blue-deep)} @media (prefers-color-scheme:dark){a{color:var(--blue)}}
  .wrap{max-width:900px;margin:0 auto}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--c-blue),var(--c-purple)) 1}
  .topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
  .topbar .spacer{flex:1}
  .topbar a.btn{font-size:14px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);color:var(--text);background:var(--card)}
  main{position:relative;background:var(--card);padding:26px;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden}
  main::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--c-blue),var(--c-purple))}
  input,button,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--input-bg);color:var(--text)}
  input{width:min(320px,100%)} input[type=checkbox]{width:auto}
  button{cursor:pointer;border:0}
  button.primary{background:linear-gradient(135deg,var(--c-blue),var(--c-purple));color:#fff}
  button.primary:hover{opacity:.92}
  button.danger{background:#d23f3f;color:#fff}
  button.danger:hover{opacity:.92}
  button.mini{padding:6px 12px;font-size:13px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .row label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
  .tip{font-size:13px;color:var(--muted);line-height:1.6;margin:6px 0 0}
  .status{font-size:14px;margin:14px 0;padding:10px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--c-blue)}
  ul#list{list-style:none;margin:10px 0 0;padding:0}
  li{padding:14px;border-bottom:1px solid var(--border);white-space:pre-wrap}
  li:last-child{border-bottom:0}
  .line{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .badge{font-size:12px;padding:3px 10px;border-radius:20px;white-space:nowrap;font-weight:600;flex:none}
  .ok{background:var(--ok-bg);color:var(--ok)} .read{background:var(--read-bg);color:var(--read)} .new{background:var(--new-bg);color:var(--new)}
  .meta{font-size:12px;color:var(--muted);margin-top:6px}
  .tools{display:none;border-top:1px solid var(--border);margin-top:16px;padding-top:16px}
  .tools.show{display:block}
  pre#cmd{font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);border:1px solid var(--border);padding:14px;border-radius:10px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:8px 0}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .clear-row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .clear-st{font-size:13px;color:var(--muted)}
  footer{border-top:1px solid var(--border);margin-top:22px;padding-top:18px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
  footer .links{display:flex;gap:16px;flex-wrap:wrap}
  @media (max-width:560px){main{padding:18px}input{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="brand">
      <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#43A6FF"/><stop offset="1" stop-color="#0057D9"/></linearGradient></defs>
        <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#g)"/>
        <g fill="#fff"><rect x="20" y="26" width="4" height="12" rx="2"/><rect x="28" y="20" width="4" height="24" rx="2"/><rect x="36" y="24" width="4" height="16" rx="2"/><rect x="44" y="29" width="4" height="6" rx="2"/></g>
        <circle cx="46" cy="44" r="4" fill="#FF9F40"/>
      </svg>
      Noti Voice 后台
    </span>
    <span class="spacer"></span>
    <a class="btn" href="/">← 返回首页</a>
  </div>

  <main>
    <div class="row">
      <input id="token" type="password" placeholder="API Token（Bearer）" autocomplete="off" />
      <button id="load" class="primary">验证并加载</button>
    </div>
    <p class="tip">提示：Token 仅保存在本浏览器 localStorage，不会发送到除本服务外的任何地方。</p>

    <div class="row" style="margin-top:16px">
      <label><input type="checkbox" id="auto" /> 自动刷新（5 秒）</label>
      <label><input type="checkbox" id="unplayed" /> 仅看未播报</label>
    </div>

    <div id="status" class="status">请先输入 Token 并点击「验证并加载」。</div>

    <ul id="list"></ul>

    <div id="tools" class="tools">
      <div class="row">
        <label>测试音色
          <select id="slot">
            <option value="1">#1（默认）</option>
            <option value="2">#2</option>
            <option value="3">#3</option>
          </select>
        </label>
        <button id="copy" class="mini">复制测试命令</button>
      </div>
      <pre id="cmd"></pre>
      <p class="tip">下方命令含明文 Token，仅供本地测试，勿外发。</p>

      <div class="clear-row">
        <button id="clear" class="danger mini">清空全部消息</button>
        <span id="clearst" class="clear-st"></span>
      </div>
    </div>
  </main>

  <footer>
    <span>Noti Voice · 开源通知语音播报系统 · v0.1.0</span>
    <span class="links">
      <a href="/">首页</a>
      <a href="https://github.com/lemoai/noti-voice" target="_blank" rel="noopener">GitHub</a>
      <span>MIT License</span>
    </span>
  </footer>
</div>

<script>
// 草稿阶段：本地预览（localhost/file）连线上 API；部署到 notivoice.laomo.app 后走同源
const API_BASE = (location.hostname==='notivoice.laomo.app') ? '' : 'https://notivoice.laomo.app';
const ti=document.querySelector('#token'),st=document.querySelector('#status'),ls=document.querySelector('#list'),tools=document.querySelector('#tools');
const q=String.fromCharCode(39),cmd=document.querySelector('#cmd'),copy=document.querySelector('#copy');
let verified=false;
try{ti.value=localStorage.getItem('nv_token')||''}catch(e){}
function hideTools(){verified=false;cmd.textContent='';copy.textContent='复制测试命令';tools.classList.remove('show')}
function buildCmd(){
 if(!verified)return;
 const slot=document.querySelector('#slot').value,tok=ti.value.trim();
 if(!tok){hideTools();return}
 cmd.textContent='curl -X POST '+q+API_BASE+'/api/notifications'+q+' -H '+q+'Content-Type: application/json'+q+' -H '+q+'Authorization: Bearer '+tok+q+' -d '+q+'{"text":"测试消息：一条新的 BTC 提醒","voice":'+slot+'}'+q;
}
ti.addEventListener('input',()=>{try{localStorage.setItem('nv_token',ti.value.trim())}catch(e){}hideTools()});
document.querySelector('#slot').onchange=buildCmd;
copy.onclick=async()=>{if(!verified||!cmd.textContent)return;try{await navigator.clipboard.writeText(cmd.textContent);copy.textContent='已复制 ✓'}catch(e){copy.textContent='请手动复制'}};
function fmt(s){return s?String(s).replace('T',' ').replace('Z','').slice(0,19):''}
async function load(){
 try{
  const r=await fetch(API_BASE+'/api/admin/notifications',{headers:{Authorization:'Bearer '+ti.value.trim()}});
  const j=await r.json();
  if(!r.ok){st.textContent=r.status===401?'Token 不正确或未提供（HTTP 401）':'请求被拒绝（HTTP '+r.status+'）';hideTools();ls.replaceChildren();return}
  verified=true;tools.classList.add('show');buildCmd();
  let msgs=j.messages||[];
  const played=msgs.filter(x=>x.played_at).length,read=msgs.filter(x=>x.fetched_at&&!x.played_at).length,fresh=msgs.filter(x=>!x.fetched_at).length;
  st.textContent='共 '+msgs.length+' 条  ·  已播报 '+played+'  ·  已读取未播报 '+read+'  ·  未读取 '+fresh;
  if(document.querySelector('#unplayed').checked)msgs=msgs.filter(x=>!x.played_at);
  ls.replaceChildren(...msgs.map(x=>{
   const li=document.createElement('li'),line=document.createElement('div'),badge=document.createElement('span'),txt=document.createElement('span'),meta=document.createElement('div');
   if(x.played_at){badge.className='badge ok';badge.textContent='已播报 · '+fmt(x.played_at)}
   else if(x.fetched_at){badge.className='badge read';badge.textContent='已读取 · 未播报'+(x.fetch_count>1?' · 取走 '+x.fetch_count+' 次':'')}
   else{badge.className='badge new';badge.textContent='未读取'}
   txt.textContent=x.text;line.className='line';line.append(badge,txt);
   meta.className='meta';meta.textContent='#'+x.seq+' · 音色 #'+(x.voice_slot||1)+' · 投递 '+fmt(x.created_at)+(x.fetched_at?' · 首次取走 '+fmt(x.fetched_at):'')+(x.played_at?' · 播报回执 '+fmt(x.played_at):'');
   li.append(line,meta);return li;
  }));
 }catch(e){st.textContent='请求失败：'+e.message;hideTools();ls.replaceChildren()}
}
document.querySelector('#load').onclick=load;
ti.addEventListener('keydown',e=>{if(e.key==='Enter')load()});
document.querySelector('#unplayed').onchange=load;
const clearBtn=document.querySelector('#clear'),clearSt=document.querySelector('#clearst');
clearBtn.onclick=async()=>{ if(!confirm('确定清空服务器上全部消息吗？此操作不可恢复。'))return; clearSt.textContent='清空中…'; try{ const r=await fetch(API_BASE+'/api/admin/notifications/clear',{method:'POST',headers:{Authorization:'Bearer '+ti.value.trim()}}); const j=await r.json(); if(!r.ok){clearSt.textContent='清空失败（HTTP '+r.status+'）';return} clearSt.textContent='已清空 '+j.deleted+' 条'; load(); }catch(e){clearSt.textContent='清空失败：'+e.message} };
setInterval(()=>{if(document.querySelector('#auto').checked&&ti.value.trim())load()},5000);
</script>
</body>
</html>
